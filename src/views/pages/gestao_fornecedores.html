<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plurix · Procurement 360</title>
<link rel="icon" href="/public/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
@font-face {
  font-family: "Inter";
  font-style: normal;
  font-weight: 100 900;
  font-display: swap;
  src: url(/public/fonts/inter-latin-wght.woff2) format("woff2");
}
*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
:root {
  --bg-page: #F4F6FB;
  --surface: #FFFFFF;
  --surface-subtle: #F8FAFC;
  --navy-sidebar: #050C38;
  --navy-hero: #06104A;
  --navy-primary: #0B1B69;
  --navy-primary-hover: #13288C;
  --blue-accent: #3B5BDB;
  --blue-soft: #EDF2FF;
  --text-main: #0B1536;
  --text-secondary: #5A6882;
  --text-muted: #8492A6;
  --border-light: #E6ECF5;
  --border-input: #DCE4F0;
  --ok-bg: #E6F8EF;
  --ok-text: #0D7A49;
  --ok-dot: #12A15E;
  --warn-bg: #FFF6E0;
  --warn-text: #9C5700;
  --warn-dot: #E68A00;
  --bad-bg: #FFEBEB;
  --bad-text: #C92A2A;
  --bad-dot: #E03131;
  --info-bg: #E8EEFF;
  --info-text: #1E40AF;
  --info-dot: #3B5BDB;
  --f-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow-card: 0 2px 12px rgba(11, 21, 54, 0.035), 0 0 0 1px #E6ECF5;
  --shadow-topbar: 0 4px 20px rgba(11, 21, 54, 0.045), 0 0 0 1px #E6ECF5;
  --shadow-modal: 0 24px 64px rgba(5, 12, 56, 0.22), 0 0 0 1px #E6ECF5;
}
html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  font-family: var(--f-sans);
  font-size: 14px;
  line-height: 1.45;
  color: var(--text-main);
  background: var(--bg-page);
  font-feature-settings: "tnum" 1, "cv11" 1;
  min-height: 100vh;
}
button, input, select, textarea {
  font: inherit;
  color: inherit;
}
.hidden {
  display: none !important;
}
/* ── Shell Principal: Sidebar Navy + Área de Conteúdo ── */
.p360-shell {
  display: flex;
  min-height: 100vh;
}
.p360-sidebar {
  width: 248px;
  flex-shrink: 0;
  background: linear-gradient(180deg, #060F42 0%, #030829 100%);
  color: #FFFFFF;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  z-index: 40;
}
.p360-brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 8px 6px;
  text-decoration: none;
  color: #FFFFFF;
}
.p360-brand-logo {
  font-size: 23px;
  font-weight: 800;
  letter-spacing: -0.04em;
  color: #FFFFFF;
  line-height: 1;
}
.p360-brand-sep {
  width: 1px;
  height: 18px;
  background: rgba(255, 255, 255, 0.18);
}
.p360-brand-sub {
  font-size: 12.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.56);
  white-space: nowrap;
}
.p360-nav {
  display: flex;
  flex-direction: column;
  gap: 6px;
  flex: 1;
}
.p360-nav-group {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin-top: 4px;
}
.p360-nav-group-title {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  font-size: 13.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.88);
}
.p360-nav-group-title svg,
.p360-nav-item svg {
  width: 16px;
  height: 16px;
  color: rgba(255, 255, 255, 0.62);
  flex-shrink: 0;
}
.p360-nav-children {
  position: relative;
  margin-left: 19px;
  padding-left: 12px;
  border-left: 1px solid rgba(255, 255, 255, 0.12);
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.p360-nav-item {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  width: 100%;
  padding: 9px 14px;
  border: 1px solid transparent;
  border-radius: 11px;
  background: transparent;
  color: rgba(255, 255, 255, 0.72);
  font-size: 13.5px;
  font-weight: 500;
  text-align: left;
  cursor: pointer;
  transition: all 0.16s ease;
}
.p360-nav-item:hover {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.06);
}
.p360-nav-item.active {
  color: #FFFFFF;
  font-weight: 600;
  background: linear-gradient(90deg, rgba(49, 84, 214, 0.34) 0%, rgba(28, 52, 148, 0.18) 100%);
  border-color: rgba(110, 145, 255, 0.26);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18);
}
.p360-nav-item.active::before {
  content: "";
  position: absolute;
  left: -1px;
  top: 8px;
  bottom: 8px;
  width: 3px;
  border-radius: 3px;
  background: #FFFFFF;
  box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
}
.p360-nav-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.12);
  color: rgba(255, 255, 255, 0.85);
}
/* ── Área Principal e Topbar Flutuante ── */
.p360-main-wrap {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  padding: 16px 32px 48px;
}
.p360-topbar {
  position: sticky;
  top: 16px;
  z-index: 50;
  background: rgba(255, 255, 255, 0.94);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  border-radius: 16px;
  box-shadow: var(--shadow-topbar);
  padding: 10px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 24px;
}
.p360-topbar::before {
  content: "";
  position: absolute;
  top: -16px;
  left: -8px;
  right: -8px;
  height: 16px;
  background: linear-gradient(180deg, var(--bg-page) 60%, rgba(244, 246, 251, 0) 100%);
  pointer-events: none;
}
.p360-inv-picker {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 7px 12px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  cursor: pointer;
  transition: background 0.15s;
}
.p360-inv-picker:hover {
  background: var(--surface-subtle);
}
.p360-inv-picker svg {
  width: 16px;
  height: 16px;
  color: var(--navy-primary);
}
.p360-inv-picker select {
  border: none;
  background: transparent;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
  outline: none;
  padding-right: 4px;
}
.p360-search-top {
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(440px, 100%);
  height: 38px;
  padding: 0 14px;
  border-radius: 11px;
  background: #F4F7FC;
  border: 1px solid #E5ECF6;
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
}
.p360-search-top:focus-within {
  background: #FFFFFF;
  border-color: var(--blue-accent);
  box-shadow: 0 0 0 3px rgba(59, 91, 219, 0.12);
}
.p360-search-top svg {
  width: 15px;
  height: 15px;
  color: var(--text-muted);
  flex-shrink: 0;
}
.p360-search-top input {
  width: 100%;
  border: none;
  background: transparent;
  outline: none;
  font-size: 13.5px;
  color: var(--text-main);
}
.p360-search-top input::placeholder {
  color: var(--text-muted);
}
.p360-user-area {
  display: flex;
  align-items: center;
  gap: 12px;
}
.p360-user-pill {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 6px;
}
.p360-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: #E8EEFF;
  color: var(--navy-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12.5px;
  font-weight: 700;
}
.p360-user-info {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}
.p360-user-info b {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-main);
}
.p360-user-info span {
  font-size: 11.5px;
  color: var(--text-muted);
}
/* ── Hero Banner do Cockpit (Home) ── */
.p360-hero {
  position: relative;
  border-radius: 22px;
  padding: 28px 30px 26px;
  color: #FFFFFF;
  background:
    radial-gradient(circle at 75% 20%, rgba(66, 112, 255, 0.22) 0%, transparent 52%),
    radial-gradient(circle at 30% 85%, rgba(35, 72, 204, 0.25) 0%, transparent 48%),
    linear-gradient(135deg, #050E42 0%, #091863 55%, #050C38 100%);
  box-shadow: 0 12px 32px rgba(6, 16, 74, 0.16);
  margin-bottom: 24px;
  overflow: hidden;
}
.p360-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: radial-gradient(rgba(255, 255, 255, 0.11) 1px, transparent 1px);
  background-size: 20px 20px;
  opacity: 0.45;
  pointer-events: none;
}
.p360-hero-top {
  position: relative;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.p360-hero-date {
  font-size: 12.5px;
  color: rgba(255, 255, 255, 0.65);
  margin-bottom: 4px;
}
.p360-hero-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1.15;
}
.p360-hero-sub {
  font-size: 14px;
  color: rgba(255, 255, 255, 0.68);
  margin-top: 3px;
}
.p360-hero-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 7px 14px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.09);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: rgba(255, 255, 255, 0.9);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.15s;
}
.p360-hero-pill:hover {
  background: rgba(255, 255, 255, 0.16);
}
.p360-hero-kpis {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.p360-hero-card {
  background: rgba(16, 33, 102, 0.62);
  border: 1px solid rgba(122, 156, 255, 0.16);
  backdrop-filter: blur(12px);
  border-radius: 16px;
  padding: 18px 20px 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  cursor: pointer;
  text-align: left;
  color: #FFFFFF;
  transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
}
.p360-hero-card:hover {
  transform: translateY(-2px);
  background: rgba(22, 44, 128, 0.72);
  border-color: rgba(145, 175, 255, 0.34);
}
.p360-hero-card-label {
  font-size: 12.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.72);
}
.p360-hero-card-val {
  display: flex;
  align-items: baseline;
  gap: 10px;
}
.p360-hero-card-val b {
  font-size: 32px;
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
}
.p360-hero-card-val span {
  font-size: 12.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.68);
}
.p360-hero-card-val span.danger {
  color: #FF7878;
  font-weight: 600;
}
.p360-hero-card-val span.warn {
  color: #FBBF24;
  font-weight: 600;
}
.p360-hero-bar {
  height: 3px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
  margin-top: auto;
}
.p360-hero-bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: #4C6EF5;
}
.p360-hero-bar i.danger {
  background: #FF6B6B;
}
.p360-hero-bar i.warn {
  background: #F59F00;
}
/* ── Grid da Home (Precisa de atenção + Cotações em andamento) ── */
.p360-home-grid {
  display: grid;
  grid-template-columns: 1.12fr 0.88fr;
  gap: 22px;
  align-items: start;
}
.p360-card {
  background: var(--surface);
  border-radius: 18px;
  box-shadow: var(--shadow-card);
  padding: 22px 24px;
}
.p360-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 14px;
}
.p360-card-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-main);
}
.p360-card-title span {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--text-muted);
}
/* Lista "Precisa de atenção" */
.p360-attn-list {
  display: flex;
  flex-direction: column;
}
.p360-attn-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 14px 0;
  border-bottom: 1px solid #EEF2F8;
}
.p360-attn-row:last-child {
  border-bottom: none;
  padding-bottom: 2px;
}
.p360-attn-left {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}
.p360-attn-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.p360-attn-icon.bad {
  background: #FFF0F0;
  color: #E03131;
}
.p360-attn-icon.att {
  background: #FFF8E6;
  color: #D97706;
}
.p360-attn-icon svg {
  width: 16px;
  height: 16px;
}
.p360-attn-info {
  min-width: 0;
}
.p360-attn-name {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}
.p360-attn-name b {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
}
.p360-attn-name b:hover {
  color: var(--blue-accent);
}
.p360-attn-name code {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--text-muted);
}
.p360-attn-desc {
  font-size: 13px;
  font-weight: 500;
  color: #D93838;
  margin-top: 2px;
}
.p360-attn-desc.att {
  color: #B45309;
}
/* Lista "Cotações em andamento" com barra de timeline */
.p360-rfq-list {
  display: flex;
  flex-direction: column;
}
.p360-rfq-item {
  padding: 15px 0;
  border-bottom: 1px solid #EEF2F8;
  cursor: pointer;
  transition: opacity 0.15s;
}
.p360-rfq-item:last-child {
  border-bottom: none;
  padding-bottom: 2px;
}
.p360-rfq-item:hover .p360-rfq-title b {
  color: var(--blue-accent);
}
.p360-rfq-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 10px;
}
.p360-rfq-title {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.p360-rfq-title code {
  font-family: var(--f-mono);
  font-size: 12px;
  color: var(--text-secondary);
  flex-shrink: 0;
}
.p360-rfq-title b {
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-main);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.p360-rfq-dots {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-secondary);
}
.p360-rfq-dots i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #D5DFEE;
  display: inline-block;
}
.p360-rfq-dots i.on {
  background: #2B4ACB;
}
.p360-rfq-inv {
  font-size: 12.5px;
  color: var(--text-muted);
  margin-top: 2px;
  margin-bottom: 10px;
}
.p360-rfq-bar-row {
  display: flex;
  align-items: center;
  gap: 14px;
}
.p360-rfq-track-wrap {
  flex: 1;
  min-width: 0;
}
.p360-rfq-track {
  position: relative;
  height: 3px;
  border-radius: 99px;
  background: #E6ECF5;
}
.p360-rfq-track i {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  border-radius: 99px;
  background: #2B4ACB;
}
.p360-rfq-track i.warn {
  background: #B7791F;
}
.p360-rfq-track i.done {
  background: #94A3B8;
}
.p360-rfq-track em {
  position: absolute;
  top: -3px;
  width: 2px;
  height: 9px;
  background: #B7791F;
}
.p360-rfq-dates {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--text-muted);
  margin-top: 5px;
}
.p360-rfq-right-stat {
  font-size: 12.5px;
  font-weight: 600;
  flex-shrink: 0;
  color: var(--text-secondary);
}
.p360-rfq-right-stat.warn {
  color: #B45309;
}
/* ── Cabeçalhos de Página Interna (Breadcrumb + Título + CTA) ── */
.p360-page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.p360-breadcrumb {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-muted);
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.p360-breadcrumb button {
  border: none;
  background: none;
  padding: 0;
  color: var(--text-muted);
  cursor: pointer;
}
.p360-breadcrumb button:hover {
  color: var(--navy-primary);
  text-decoration: underline;
}
.p360-page-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--text-main);
  line-height: 1.15;
}
.p360-page-count {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 3px;
}
/* ── Botões Clean ── */
.p360-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  height: 36px;
  padding: 0 16px;
  border-radius: 10px;
  border: 1px solid var(--border-input);
  background: #FFFFFF;
  color: var(--text-main);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s ease;
}
.p360-btn:hover:not(:disabled) {
  background: #F8FAFC;
  border-color: #C5D2E8;
}
.p360-btn.primary {
  height: 40px;
  padding: 0 18px;
  background: var(--navy-primary);
  border-color: var(--navy-primary);
  color: #FFFFFF;
  box-shadow: 0 2px 8px rgba(11, 27, 105, 0.18);
}
.p360-btn.primary:hover:not(:disabled) {
  background: var(--navy-primary-hover);
  border-color: var(--navy-primary-hover);
}
.p360-btn.sm {
  height: 32px;
  padding: 0 13px;
  font-size: 12.5px;
  border-radius: 9px;
}
.p360-btn svg {
  width: 15px;
  height: 15px;
}
/* ── Tabs em Pílula Suave (como na tela de Homologação) ── */
.p360-tabs {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.p360-tab {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  height: 36px;
  padding: 0 15px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text-secondary);
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
}
.p360-tab:hover {

      $('appMain').innerHTML = '<div class="p360-card" style="text-align:center;padding:64px 24px;color:var(--text-muted)">Carregando central de trabalho Plurix...</div>'

  function badgeStatusFornecedor(st) {
    var m = {
      'Homologado': ['ok', 'Completo'],
      'Em análise': ['info', 'Em análise'],
      'Aguardando análise': ['warn', 'Aguardando análise'],
      'Pendente fornecedor': ['warn', 'Devolvida'],
      'Convidado': ['neutral', 'Convidado'],
      'Cadastro em andamento': ['neutral', 'Em cadastro'],
      'Homologação vencida': ['bad', 'Vencida'],
      'Bloqueado': ['bad', 'Bloqueado'],
      'Reprovado': ['bad', 'Reprovado']
    }[st] || ['neutral', st]
    return '<span class="p360-badge ' + m[0] + '"><i></i>' + esc(m[1]) + '</span>'
  }
  function badgeStatusDoc(st) {
    var m = {
      'valido': ['ok', 'Válido'],
      'proximo_vencimento': ['warn', 'Vencendo em 30d'],

      'pendente': ['neutral', 'Pendente'],
      'em_analise': ['info', 'Em análise'],
      'rejeitado': ['bad', 'Rejeitado']
    }[st] || ['neutral', st]
    return '<span class="p360-badge ' + m[0] + '"><i></i>' + esc(m[1]) + '</span>'
  }
  function badgeStatusCotacao(st) {
    var m = {
      'Aberta': ['info', 'aberta'],
      'Recebendo propostas': ['info', 'recebendo propostas'],
      'Em análise': ['info', 'em análise'],

      'Convite programado': ['neutral', 'programada'],
      'Rascunho': ['neutral', 'rascunho'],
      'Encerrada': ['ok', 'encerrada'],
      'Cancelada': ['bad', 'cancelada']

      '</div>'

  function render() {
    if (!S.dados) return
    renderSidebar()
    var html = ''
    if (S.subTela === 'fornecedor') html = viewDetalheFornecedor()
    else if (S.subTela === 'homologacao') html = viewMesaHomologacao()
    else if (S.subTela === 'cotacao') html = viewDetalheCotacao()
    else if (S.subTela === 'nova-cotacao') html = viewWizardCotacao()
    else {
      switch (S.tela) {
        case 'inicio': html = viewHome(); break
        case 'base': html = viewBaseFornecedores(); break
        case 'homologacoes': html = viewHomologacoes(); break
        case 'cotacoes': html = viewCotacoes(); break
        case 'mapa': html = viewMapaComparativo(); break
        case 'indicadores': html = viewIndicadores(); break
        case 'investidas': html = viewInvestidas(); break
        case 'categorias': html = viewCategorias(); break
        case 'documentos': html = viewTiposDocumento(); break
        case 'regras': html = viewRegrasHomologacao(); break
        case 'usuarios': html = viewUsuarios(); break
        default: html = viewHome()
      }
    }
    $('appMain').innerHTML = html
  }
  // ═══════════════════════════════════════════════════════════════════════════════
  // 1. HOME / CENTRAL DE TRABALHO (HERO NAVY + 2 COLUNAS CLEAN)

  function viewHome() {
    var d = S.dados
    var k = d.kpis
    var heroHtml =
      '<section class="p360-hero">' +
        '<div class="p360-hero-top">' +
          '<div>' +
            '<div class="p360-hero-date">Segunda-feira, 16 de novembro</div>' +
            '<h1 class="p360-hero-title">Bom dia, Administrador</h1>' +
            '<div class="p360-hero-sub">Central de trabalho</div>' +
          '</div>' +
          '<button type="button" class="p360-hero-pill" data-open-sub="nova-cotacao">' +

        '</div>' +
        '<div class="p360-hero-kpis">' +
          '<button type="button" class="p360-hero-card" data-nav="homologacoes">' +
            '<span class="p360-hero-card-label">Homologações aguardando análise</span>' +
            '<div class="p360-hero-card-val"><b>' + k.homologAguardando + '</b><span>em dia</span></div>' +
            '<div class="p360-hero-bar"><i style="width:35%"></i></div>' +
          '</button>' +
          '<button type="button" class="p360-hero-card" data-nav="base">' +
            '<span class="p360-hero-card-label">Documentos vencendo em 30 dias</span>' +
            '<div class="p360-hero-card-val"><b>' + k.docsVencendo30d + '</b><span class="danger">+ ' + k.docsVencidos + ' vencidos</span></div>' +
            '<div class="p360-hero-bar"><i class="danger" style="width:68%"></i></div>' +
          '</button>' +
          '<button type="button" class="p360-hero-card" data-nav="cotacoes">' +
            '<span class="p360-hero-card-label">Cotações abertas</span>' +
            '<div class="p360-hero-card-val"><b>' + k.cotacoesAbertas + '</b><span>' + k.respostasRecebidasAbertas + '/' + k.convitesTotaisAbertos + ' respostas</span></div>' +
            '<div class="p360-hero-bar"><i style="width:52%"></i></div>' +
          '</button>' +
          '<button type="button" class="p360-hero-card" data-nav="cotacoes">' +
            '<span class="p360-hero-card-label">Encerrando em 48 h</span>' +
            '<div class="p360-hero-card-val"><b>' + k.cotacoesEncerrando48h + '</b><span class="warn">1 em risco</span></div>' +
            '<div class="p360-hero-bar"><i class="warn" style="width:50%"></i></div>' +
          '</button>' +
        '</div>' +
      '</section>'
    var alertas = d.alertasAtencao || []
    var attnRows = alertas.map(function (a) {
      var isDoc = a.tipo === 'documento_vencido'
      return '<div class="p360-attn-row">' +
        '<div class="p360-attn-left">' +
          '<div class="p360-attn-icon ' + a.criticidade + '">' + (isDoc ? SVG_ALERT : SVG_CLOCK) + '</div>' +
          '<div class="p360-attn-info">' +
            '<div class="p360-attn-name">' +
              '<b data-alerta-mod="' + a.alvoModulo + '" data-alerta-id="' + a.alvoId + '">' + esc(a.fornecedorOuRef) + '</b>' +
              '<code>' + esc(a.subtitulo) + '</code>' +
            '</div>' +
            '<div class="p360-attn-desc ' + (a.criticidade === 'att' ? 'att' : '') + '">' + esc(a.detalhe) + '</div>' +
          '</div>' +
        '</div>' +
        '<button type="button" class="p360-btn sm" data-alerta-mod="' + a.alvoModulo + '" data-alerta-id="' + a.alvoId + '">' +
          esc(a.acaoRotulo) +
        '</button>' +
      '</div>'
    }).join('')
    var cotsAtivas = d.cotacoes.filter(function (c) { return c.status !== 'Cancelada' }).slice(0, 5)
    var rfqRows = cotsAtivas.map(function (c, idx) {
      var conv = c.fornecedoresConvidados.length
      var resp = c.fornecedoresConvidados.filter(function (f) { return f.respondeu }).length
      var dots = ''
      for (var i = 0; i < Math.max(conv, 3); i++) {
        dots += '<i class="' + (i < resp ? 'on' : '') + '"></i>'
      }
      var pct = c.status === 'Em análise' || c.status === 'Encerrada' ? 100 : c.horasRestantes <= 24 ? 82 : idx % 2 === 0 ? 60 : 32
      var barClass = c.status === 'Em análise' || c.status === 'Encerrada' ? 'done' : c.horasRestantes <= 48 ? 'warn' : ''
      var statRight = c.status === 'Em análise'
        ? badgeStatusCotacao('Em análise')
        : c.status === 'Encerrada'
          ? badgeStatusCotacao('Encerrada')
          : '<span class="p360-rfq-right-stat ' + (c.horasRestantes <= 48 ? 'warn' : '') + '">' + (c.horasRestantes <= 48 ? c.horasRestantes + ' h' : Math.ceil(c.horasRestantes / 24) + ' dias') + '</span>'
      return '<div class="p360-rfq-item" data-open-cot="' + c.id + '">' +
        '<div class="p360-rfq-top">' +
          '<div class="p360-rfq-title"><code>' + esc(c.id) + '</code><b>' + esc(c.titulo) + '</b></div>' +
          '<div class="p360-rfq-dots">' + dots + ' <span>' + resp + '/' + conv + '</span></div>' +
        '</div>' +
        '<div class="p360-rfq-inv">' + esc(NOME_INVESTIDA[c.investida] || c.investida) + '</div>' +
        '<div class="p360-rfq-bar-row">' +
          '<div class="p360-rfq-track-wrap">' +
            '<div class="p360-rfq-track">' +
              '<i class="' + barClass + '" style="width:' + pct + '%"></i>' +
              (pct < 100 ? '<em style="left:' + pct + '%"></em>' : '') +
            '</div>' +
            '<div class="p360-rfq-dates"><span>' + esc(c.abertura.slice(0, 5)) + '</span><span>' + esc(c.prazo) + '</span></div>' +
          '</div>' +
          statRight +
        '</div>' +
      '</div>'
    }).join('')
    return heroHtml +
      '<div class="p360-home-grid">' +
        '<section class="p360-card">' +
          '<div class="p360-card-header">' +
            '<div class="p360-card-title">Precisa de atenção <span>' + alertas.length + '</span></div>' +
          '</div>' +
          '<div class="p360-attn-list">' + (attnRows || '<div style="padding:24px 0;color:var(--text-muted)">Nenhuma pendência crítica no momento.</div>') + '</div>' +

      '</div>'
  }
  // ═══════════════════════════════════════════════════════════════════════════════
  // 2. BASE DE FORNECEDORES (CLEAN & SPACIOUS)
  // ═══════════════════════════════════════════════════════════════════════════════
  function viewBaseFornecedores() {
    var d = S.dados
    var fb = S.fBase
    var q = (fb.busca || S.buscaGlobal || '').toLowerCase().trim()
    var lista = d.fornecedores.filter(function (f) {
      var txt = (f.razaoSocial + ' ' + f.nomeFantasia + ' ' + f.cnpj + ' ' + f.categoria + ' ' + f.subcategoria).toLowerCase()
      if (q && !txt.includes(q)) return false
      if (fb.categoria && f.categoria !== fb.categoria) return false
      if (fb.uf && f.uf !== fb.uf) return false
      if (fb.situacao && f.statusHomologacao !== fb.situacao) return false
      if (fb.bloqueio === 'sem' && f.bloqueado) return false
      if (fb.bloqueio === 'com' && !f.bloqueado) return false
      if (fb.investidaElegivel && !f.investidasHomologadas.includes(fb.investidaElegivel)) return false
      return true
    })
    var rows = lista.map(function (f) {
      var invPrincipal = f.investidasHomologadas[0]
      var homologCell = invPrincipal
        ? '<div class="p360-scope-badge">' +
            '<span class="p360-scope-inv">' + SVG_SHIELD + esc(NOME_INVESTIDA[invPrincipal] || invPrincipal) + (f.investidasHomologadas.length > 1 ? ' +' + (f.investidasHomologadas.length - 1) : '') + '</span>' +
            '<span class="p360-scope-cat">' + esc(f.subcategoria) + '</span>' +
          '</div>'
        : f.statusHomologacao === 'Em análise' || f.statusHomologacao === 'Aguardando análise'
          ? '<span style="color:var(--blue-accent);font-weight:500;font-size:13px">1 em andamento</span>'
          : '<span style="color:var(--text-muted);font-size:13px">Sem homologação</span>'
      var docAlert = f.docsVencidos > 0
        ? '<span class="p360-doc-alert-pill" title="' + f.docsVencidos + ' documento(s) vencido(s) ou rejeitado(s)">📄 ' + f.docsVencidos + '</span>'
        : f.docsVencendo30d > 0
          ? '<span class="p360-doc-alert-pill warn" title="' + f.docsVencendo30d + ' documento(s) vencendo em até 30 dias">📄 ' + f.docsVencendo30d + '</span>'
          : ''
      return '<tr class="clickable" data-open-forn="' + f.id + '">' +
        '<td>' +
          '<div class="p360-cell-title">' + esc(f.razaoSocial) + '</div>' +
          '<div class="p360-cell-sub">' + esc(f.subcategoria) + ' · ' + esc(f.cidade) + ' · ' + esc(f.uf) + '</div>' +
        '</td>' +
        '<td class="p360-mono">' + esc(f.cnpj) + '</td>' +
        '<td>' + homologCell + '</td>' +
        '<td>' + badgeStatusFornecedor(f.statusHomologacao) + docAlert + '</td>' +
      '</tr>'
    }).join('')
    return (
      '<div class="p360-page-header">' +
        '<div>' +
          '<div class="p360-breadcrumb">Fornecedores</div>' +
          '<h1 class="p360-page-title">Base de fornecedores</h1>' +
          '<div class="p360-page-count">' + lista.length + ' fornecedores</div>' +
        '</div>' +
        '<button type="button" class="p360-btn primary" id="btnConvidarFornecedor">+ Convidar fornecedor</button>' +
      '</div>' +
      '<div class="p360-table-card">' +
        '<div class="p360-filters-bar">' +
          '<label class="p360-search-field">' + SVG_SEARCH +
            '<input id="fBaseBusca" value="' + esc(fb.busca) + '" placeholder="Buscar por razão social, fantasia ou CNPJ">' +
          '</label>' +
          '<select class="p360-select" id="fBaseCat"><option value="">Todas as categorias</option>' +
            d.categorias.map(function (c) { return '<option value="' + esc(c.nome) + '"' + (fb.categoria === c.nome ? ' selected' : '') + '>' + esc(c.nome) + '</option>' }).join('') +
          '</select>' +
          '<select class="p360-select" id="fBaseUf"><option value="">Todas as UFs</option>' +
            ['SP', 'PR', 'SC', 'RS'].map(function (u) { return '<option value="' + u + '"' + (fb.uf === u ? ' selected' : '') + '>' + u + '</option>' }).join('') +
          '</select>' +
          '<select class="p360-select" id="fBaseSit"><option value="">Todas as situações</option>' +
            ['Homologado', 'Em análise', 'Aguardando análise', 'Pendente fornecedor', 'Convidado', 'Bloqueado'].map(function (s) {
              return '<option value="' + s + '"' + (fb.situacao === s ? ' selected' : '') + '>' + s + '</option>'
            }).join('') +
          '</select>' +
          '<div style="width:100%;height:0"></div>' +
          '<select class="p360-select" id="fBaseBloq">' +
            '<option value="">Com e sem bloqueio</option>' +
            '<option value="sem"' + (fb.bloqueio === 'sem' ? ' selected' : '') + '>Sem bloqueio</option>' +
            '<option value="com"' + (fb.bloqueio === 'com' ? ' selected' : '') + '>Somente bloqueados</option>' +
          '</select>' +
          '<span class="p360-filter-label">Elegibilidade para</span>' +
          '<select class="p360-select" id="fBaseInvEleg"><option value="">Escolha a investida</option>' +
            d.investidas.map(function (i) { return '<option value="' + i.sigla + '"' + (fb.investidaElegivel === i.sigla ? ' selected' : '') + '>' + esc(i.nomeFantasia) + '</option>' }).join('') +
          '</select>' +
        '</div>' +
        '<div class="p360-table-wrap">' +
          '<table class="p360-table">' +
            '<thead><tr><th>Fornecedor</th><th>CNPJ</th><th>Homologação</th><th>Situação</th></tr></thead>' +
            '<tbody>' + (rows || '<tr><td colspan="4" style="text-align:center;padding:36px;color:var(--text-muted)">Nenhum fornecedor encontrado.</td></tr>') + '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>'
    )
  }
  // ═══════════════════════════════════════════════════════════════════════════════
  // 3. DETALHE DO FORNECEDOR (PERFIL 360 CLEAN)
  // ═══════════════════════════════════════════════════════════════════════════════
  function viewDetalheFornecedor() {
    var d = S.dados
    var f = d.fornecedores.find(function (x) { return x.id === S.fornecedorId }) || d.fornecedores[0]
    var homs = d.homologacoes.filter(function (h) { return h.fornecedorId === f.id })
    var cots = d.cotacoes.filter(function (c) {
      return c.fornecedoresConvidados.some(function (fc) { return fc.fornecedorId === f.id })
    })
    var abas = [
      ['visao-geral', 'Visão geral'],
      ['dados-cadastrais', 'Dados cadastrais'],
      ['documentos', 'Documentos', f.documentos.length],
      ['homologacoes', 'Homologações', homs.length],
      ['cotacoes', 'Cotações', cots.length],
      ['historico', 'Histórico', f.historico.length]
    ]
    var conteudoAba = ''
    if (S.abaFornecedor === 'visao-geral') {
      conteudoAba =
        '<div class="p360-kpi-row">' +
          '<div class="p360-kpi-box"><span>Situação de homologação</span><b>' + esc(f.statusHomologacao) + '</b><small>Elegibilidade: ' + esc(f.elegibilidade) + '</small></div>' +
          '<div class="p360-kpi-box"><span>Investidas homologadas</span><b>' + f.investidasHomologadas.length + '</b><small>' + (f.investidasHomologadas.length ? f.investidasHomologadas.join(', ') : 'Nenhuma investida ativa') + '</small></div>' +
          '<div class="p360-kpi-box"><span>Documentos regulares</span><b>' + f.documentos.filter(function (x) { return x.status === 'valido' }).length + '/' + f.documentos.length + '</b><small>' + f.docsVencidos + ' vencidos · ' + f.docsVencendo30d + ' vencendo em 30d</small></div>' +
          '<div class="p360-kpi-box"><span>Cotações (RFQs)</span><b>' + cots.length + '</b><small>Processos em que foi convidado</small></div>' +

  // ═══════════════════════════════════════════════════════════════════════════════
  // 4. HOMOLOGAÇÃO (FILA OPERACIONAL + MESA DE ANÁLISE CLEAN)
  // ═══════════════════════════════════════════════════════════════════════════════
  function viewHomologacoes() {
    var d = S.dados
    var fh = S.fHom
    var todas = d.homologacoes
    var contNaFila = todas.filter(function (h) { return h.status !== 'aprovada' && h.status !== 'reprovada' }).length
    var contAguard = todas.filter(function (h) { return h.status === 'aguardando_analise' }).length
    var contEm = todas.filter(function (h) { return h.status === 'em_analise' }).length
    var contForn = todas.filter(function (h) { return h.status === 'com_fornecedor' }).length
    var contEnc = todas.filter(function (h) { return h.status === 'aprovada' || h.status === 'reprovada' }).length
    var tabs = [
      ['na_fila', 'Na fila', contNaFila],
      ['aguardando_analise', 'Aguardando análise', contAguard],
      ['em_analise', 'Em análise', contEm],
      ['com_fornecedor', 'Com o fornecedor', contForn],
      ['encerradas', 'Encerradas', contEnc]
    ]
    var lista = todas.filter(function (h) {
      if (S.abaHomologacao === 'na_fila' && (h.status === 'aprovada' || h.status === 'reprovada')) return false
      if (S.abaHomologacao === 'aguardando_analise' && h.status !== 'aguardando_analise') return false
      if (S.abaHomologacao === 'em_analise' && h.status !== 'em_analise') return false
      if (S.abaHomologacao === 'com_fornecedor' && h.status !== 'com_fornecedor') return false
      if (S.abaHomologacao === 'encerradas' && h.status !== 'aprovada' && h.status !== 'reprovada') return false
      var q = (fh.busca || S.buscaGlobal || '').toLowerCase().trim()
      if (q && !(h.fornecedorNome + ' ' + h.razaoSocial + ' ' + h.cnpj).toLowerCase().includes(q)) return false
      if (fh.investida && h.investida !== fh.investida) return false
      if (fh.categoria && h.categoria !== fh.categoria) return false
      if (fh.responsavel && h.responsavel !== fh.responsavel) return false
      return true
    })
    var rows = lista.map(function (h) {
      var stBadge = h.status === 'em_analise'
        ? '<span class="p360-badge info"><i></i>Em análise</span>'
        : h.status === 'com_fornecedor'
          ? '<span class="p360-badge warn"><i></i>Devolvida</span>'
          : h.status === 'aguardando_analise'
            ? '<span class="p360-badge warn"><i></i>Aguardando análise</span>'
            : h.status === 'aprovada'
              ? '<span class="p360-badge ok"><i></i>Homologado</span>'
              : '<span class="p360-badge bad"><i></i>Reprovada</span>'
      var scopeStyle = h.status === 'em_analise' ? 'blue' : 'neutral'
      return '<tr class="clickable" data-open-hom="' + h.id + '">' +
        '<td>' +
          '<div class="p360-cell-title">' + esc(h.razaoSocial) + '</div>' +
          '<div class="p360-cell-sub p360-mono">' + esc(h.cnpj) + '</div>' +
        '</td>' +
        '<td>' +
          '<div class="p360-scope-badge">' +
            '<span class="p360-scope-inv ' + scopeStyle + '">' + SVG_SHIELD + esc(NOME_INVESTIDA[h.investida] || h.investida) + '</span>' +
            '<span class="p360-scope-cat">' + esc(h.categoria) + ' › ' + esc(h.subcategoria) + '</span>' +
          '</div>' +
        '</td>' +
        '<td>' + stBadge + '</td>' +
        '<td>' + h.diasNaEtapa + ' dias</td>' +
        '<td>' + (h.pendenciasAbertas > 0 ? '<span style="color:#B45309;font-weight:600">' + h.pendenciasAbertas + ' aberta</span>' : '<span style="color:var(--text-muted)">—</span>') + '</td>' +
        '<td style="color:' + (h.responsavel === 'Sem responsável' ? 'var(--text-muted)' : 'var(--text-secondary)') + '">' + esc(h.responsavel) + '</td>' +
      '</tr>'
    }).join('')
    return (
      '<div class="p360-page-header">' +
        '<div>' +
          '<div class="p360-breadcrumb">Fornecedores</div>' +
          '<h1 class="p360-page-title">Homologação</h1>' +
          '<div class="p360-page-count">' + contNaFila + ' na fila</div>' +
        '</div>' +
      '</div>' +
      '<div class="p360-tabs">' +
        tabs.map(function (t) {
          return '<button type="button" class="p360-tab ' + (S.abaHomologacao === t[0] ? 'active' : '') + '" data-aba-hom="' + t[0] + '">' +
            esc(t[1]) + ' <span>' + t[2] + '</span>' +
          '</button>'
        }).join('') +
      '</div>' +
      '<div class="p360-table-card">' +
        '<div class="p360-filters-bar">' +
          '<label class="p360-search-field">' + SVG_SEARCH +
            '<input id="fHomBusca" value="' + esc(fh.busca) + '" placeholder="Fornecedor ou CNPJ">' +
          '</label>' +
          '<select class="p360-select" id="fHomInv"><option value="">Todas as investidas</option>' +
            d.investidas.map(function (i) { return '<option value="' + i.sigla + '"' + (fh.investida === i.sigla ? ' selected' : '') + '>' + esc(i.nomeFantasia) + '</option>' }).join('') +
          '</select>' +
          '<select class="p360-select" id="fHomCat"><option value="">Todas as categorias</option>' +
            d.categorias.map(function (c) { return '<option value="' + esc(c.nome) + '"' + (fh.categoria === c.nome ? ' selected' : '') + '>' + esc(c.nome) + '</option>' }).join('') +
          '</select>' +
          '<select class="p360-select" id="fHomResp"><option value="">Qualquer responsável</option><option value="Fernanda Ribeiro"' + (fh.responsavel === 'Fernanda Ribeiro' ? ' selected' : '') + '>Fernanda Ribeiro</option><option value="Sem responsável"' + (fh.responsavel === 'Sem responsável' ? ' selected' : '') + '>Sem responsável</option></select>' +
          '<select class="p360-select" id="fHomTempo"><option value="">Qualquer tempo</option><option value="2d">2 dias ou mais</option></select>' +
        '</div>' +
        '<div class="p360-table-wrap">' +
          '<table class="p360-table">' +
            '<thead><tr><th>Fornecedor</th><th>Escopo</th><th>Situação</th><th>Na etapa</th><th>Pendências</th><th>Responsável</th></tr></thead>' +
            '<tbody>' + (rows || '<tr><td colspan="6" style="text-align:center;padding:36px;color:var(--text-muted)">Nenhuma homologação nesta aba.</td></tr>') + '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>'
    )
  }

            '<tbody>' +
              f.documentos.map(function (doc) {

  // ═══════════════════════════════════════════════════════════════════════════════
  // 5. COTAÇÕES / RFQ (LISTAGEM, STEPPER 5 ETAPAS E COCKPIT DA RFQ)
  // ═══════════════════════════════════════════════════════════════════════════════
  function viewCotacoes() {
    var d = S.dados
    var fc = S.fCot
    var q = (fc.busca || S.buscaGlobal || '').toLowerCase().trim()
    var lista = d.cotacoes.filter(function (c) {
      if (q && !(c.id + ' ' + c.titulo + ' ' + c.categoria + ' ' + c.comprador).toLowerCase().includes(q)) return false
      if (fc.status && c.status !== fc.status) return false
      if (fc.categoria && c.categoria !== fc.categoria) return false
      return true
    })
    var rows = lista.map(function (c) {
      var conv = c.fornecedoresConvidados.length
      var resp = c.fornecedoresConvidados.filter(function (f) { return f.respondeu }).length
      var dots = ''
      for (var i = 0; i < Math.max(conv, 1); i++) dots += '<i class="' + (i < resp ? 'on' : '') + '"></i>'
      return '<tr class="clickable" data-open-cot="' + c.id + '">' +

  function viewMapaComparativo() {
    var d = S.dados
    var c = d.cotacoes.find(function (x) { return x.id === S.cotacaoId }) || d.cotacoes[0]
    return (
      '<div class="p360-page-header">' +
        '<div>' +
          '<div class="p360-breadcrumb">Sourcing</div>' +
          '<h1 class="p360-page-title">Mapa comparativo e equalização</h1>' +
          '<div class="p360-page-count">Comparação lado a lado de preços, frete, impostos e homologação</div>' +
        '</div>' +
        '<select class="p360-select" id="selCotMapa">' +
          d.cotacoes.map(function (cot) {
            return '<option value="' + cot.id + '"' + (cot.id === c.id ? ' selected' : '') + '>' + esc(cot.id) + ' — ' + esc(cot.titulo) + '</option>'
          }).join('') +
        '</select>' +
      '</div>' +
      renderMatrizComparativa(c)
    )
  }
  function renderMatrizComparativa(c) {
    if (!c.propostas || !c.propostas.length) {
      return '<div class="p360-card" style="text-align:center;padding:48px;color:var(--text-muted)">Esta cotação ainda não possui propostas enviadas pelos fornecedores.</div>'
    }
    var modo = c.adjudicacao.modo || 'item'
    var completas = c.propostas.filter(function (p) { return !p.incompleta })
    var menorGlobal = completas.length
      ? Math.min.apply(null, completas.map(function (p) { return p.totalEqualizado }))
      : Math.min.apply(null, c.propostas.map(function (p) { return p.totalEqualizado }))
    var thForns = c.propostas.map(function (p) {
      var isWinnerLote = modo === 'lote' && c.adjudicacao.vencedorLoteFornecedorId === p.fornecedorId
      return '<th style="border-left:1px solid #EEF2F8;min-width:210px;vertical-align:top">' +
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px">' +
          '<b style="font-size:13.5px;color:var(--text-main)">' + esc(p.fornecedorNome) + '</b>' +
          (p.homologado ? '<span class="p360-badge ok"><i></i>Homologado</span>' : '<span class="p360-badge warn"><i></i>' + esc(p.statusHomologacao) + '</span>') +
        '</div>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">' +
          (p.docVencido ? '<span class="p360-doc-alert-pill" style="margin:0">⚠ Doc vencido</span>' : '') +
          (p.incompleta ? '<span class="p360-doc-alert-pill warn" style="margin:0">Parcial</span>' : '') +
        '</div>' +
        (modo === 'lote'
          ? '<div style="margin-top:8px"><button type="button" class="p360-btn sm ' + (isWinnerLote ? 'primary' : '') + '" data-sel-lote="' + p.fornecedorId + '" data-cot="' + c.id + '">' + (isWinnerLote ? '✓ Lote vencedor' : 'Escolher lote') + '</button></div>'
          : '') +
      '</th>'
    }).join('')
    var rowsItens = c.itens.map(function (it) {
      var precos = c.propostas
        .map(function (p) { var x = p.itens.find(function (i) { return i.itemId === it.id }); return x && x.precoUnitario != null ? x.precoUnitario : null })
        .filter(function (v) { return v != null })
      var menor = precos.length ? Math.min.apply(null, precos) : null
      var tds = c.propostas.map(function (p) {
        var ip = p.itens.find(function (i) { return i.itemId === it.id })
        if (!ip || ip.precoUnitario == null) {
          return '<td style="border-left:1px solid #EEF2F8;color:var(--text-muted)">✕ Não cotado</td>'
        }
        var isBest = menor != null && ip.precoUnitario === menor
        var isWin = (modo === 'item' && c.adjudicacao.vencedoresPorItem[it.id] === p.fornecedorId) ||
          (modo === 'lote' && c.adjudicacao.vencedorLoteFornecedorId === p.fornecedorId)
        return '<td class="' + (isBest ? 'p360-comp-best ' : '') + (isWin ? 'p360-comp-winner' : '') + '" style="border-left:1px solid #EEF2F8">' +

      var email = $('mEmail').value.trim()
      if (!razao || !cnpj || !email) { toast('Preencha Razão social, CNPJ e E-mail.'); return }
      var r = await api('/api/fornecedores/convidar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          razaoSocial: razao,
          nomeFantasia: $('mFantasia').value.trim() || razao,
          cnpj: cnpj,
          email: email,
          contatoNome: 'Comercial',
          categoria: $('mCat').value,
          subcategoria: 'Geral',
          cidade: 'São Paulo',
          uf: 'SP',
          investidasAlvo: [$('mInv').value]
        })
      })
      $('modalRoot').innerHTML = ''
      await carregar(true)
      toast('Fornecedor convidado com sucesso.')
      S.tela = 'base'
      S.subTela = 'fornecedor'
      S.fornecedorId = r.fornecedor.id
      render()
    }

  // EVENTOS INTERATIVOS
  // ═══════════════════════════════════════════════════════════════════════════════
  document.addEventListener('click', async function (e) {
    var t = e.target
    if (!t || !t.closest) return
    var navBtn = t.closest('[data-nav]')
    if (navBtn) {
      e.preventDefault()
      S.tela = navBtn.dataset.nav
      S.subTela = null
      render()
      return
    }
    var subBtn = t.closest('[data-open-sub]')
    if (subBtn) {
      S.subTela = subBtn.dataset.openSub
      S.wizard.etapa = 1
      render()
      return
    }
    var fornRow = t.closest('[data-open-forn]')
    if (fornRow && !t.closest('[data-doc-act]')) {
      S.fornecedorId = fornRow.dataset.openForn
      S.subTela = 'fornecedor'
      S.abaFornecedor = 'visao-geral'
      render()
      return
    }
    var abaForn = t.closest('[data-aba-forn]')
    if (abaForn) {
      S.abaFornecedor = abaForn.dataset.abaForn
      render()
      return
    }
    var homRow = t.closest('[data-open-hom]')
    if (homRow) {
      S.homologacaoId = homRow.dataset.openHom
      S.subTela = 'homologacao'
      render()
      return
    }
    var abaHom = t.closest('[data-aba-hom]')
    if (abaHom) {
      S.abaHomologacao = abaHom.dataset.abaHom
      render()
      return
    }
    var cotRow = t.closest('[data-open-cot]')
    if (cotRow) {
      S.cotacaoId = cotRow.dataset.openCot
      S.subTela = 'cotacao'
      S.abaCotacao = 'visao-geral'
      render()
      return
    }
    var abaCot = t.closest('[data-aba-cot]')
    if (abaCot) {
      S.abaCotacao = abaCot.dataset.abaCot
      render()
      return
    }
    var alertaBtn = t.closest('[data-alerta-mod]')
    if (alertaBtn) {
      var mod = alertaBtn.dataset.alertaMod
      var id = alertaBtn.dataset.alertaId
      if (mod === 'fornecedor') { S.fornecedorId = id; S.subTela = 'fornecedor'; S.abaFornecedor = 'documentos' }
      else if (mod === 'homologacao') { S.homologacaoId = id; S.subTela = 'homologacao' }
      else if (mod === 'cotacao') { S.cotacaoId = id; S.subTela = 'cotacao'; S.abaCotacao = 'visao-geral' }
      render()
      return
    }
    if (t.closest('#btnConvidarFornecedor')) {
      abrirModalConvidar()
      return
    }
    if (t.closest('#btnPortalTop')) {
      abrirModalPortalPreview()
      return
    }
    var docAct = t.closest('[data-doc-act]')
    if (docAct) {
      await api('/api/documentos/avaliar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fornecedorId: docAct.dataset.forn,
          docId: docAct.dataset.doc,
          acao: docAct.dataset.docAct
        })
      })
      $('modalRoot').innerHTML = ''
      await carregar(true)
      toast('Status do documento atualizado.')
      return
    }
    var decHom = t.closest('[data-decidir-hom]')
    if (decHom) {
      var parecer = $('txtParecerHom') ? $('txtParecerHom').value : ''
      await api('/api/homologacoes/decidir', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          homologacaoId: decHom.dataset.decidirHom,
          decisao: decHom.dataset.decisao,
          parecer: parecer
        })
      })
      await carregar(true)
      toast('Decisão da homologação registrada.')
      return
    }
    var modoAdj = t.closest('[data-modo-adj]')
    if (modoAdj) {
      var cotM = S.dados.cotacoes.find(function (x) { return x.id === modoAdj.dataset.cot })
      if (cotM) { cotM.adjudicacao.modo = modoAdj.dataset.modoAdj; render() }
      return
    }
    var selItem = t.closest('[data-sel-item]')
    if (selItem) {
      var cotI = S.dados.cotacoes.find(function (x) { return x.id === selItem.dataset.cot })
      if (cotI) {
        cotI.adjudicacao.modo = 'item'
        cotI.adjudicacao.vencedoresPorItem[selItem.dataset.selItem] = selItem.dataset.forn
        render()
        toast('Fornecedor vencedor selecionado para o item.')
      }
      return
    }
    var selLote = t.closest('[data-sel-lote]')
    if (selLote) {
      var cotL = S.dados.cotacoes.find(function (x) { return x.id === selLote.dataset.cot })
      if (cotL) {
        cotL.adjudicacao.modo = 'lote'
        cotL.adjudicacao.vencedorLoteFornecedorId = selLote.dataset.selLote
        render()
        toast('Fornecedor selecionado para o lote global.')
      }
      return
    }
    if (t.closest('#btnAdjudicarCot')) {
      var cid = t.closest('#btnAdjudicarCot').dataset.cot
      var cotA = S.dados.cotacoes.find(function (x) { return x.id === cid })
      await api('/api/cotacoes/adjudicar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          cotacaoId: cotA.id,
          modo: cotA.adjudicacao.modo,
          vencedorLoteFornecedorId: cotA.adjudicacao.vencedorLoteFornecedorId,
          vencedoresPorItem: cotA.adjudicacao.vencedoresPorItem,
          justificativaDecisao: 'Adjudicado via Mapa Comparativo.',
          encerrarCotacao: true
        })
      })
      await carregar(true)
      toast('Cotação adjudicada e encerrada.')
      return
    }
    var wzStep = t.closest('[data-wz-step]')
    if (wzStep) { salvarCamposWizard(); S.wizard.etapa = Number(wzStep.dataset.wzStep); render(); return }
    if (t.closest('#btnWzPrev')) { salvarCamposWizard(); S.wizard.etapa = Math.max(1, S.wizard.etapa - 1); render(); return }
    if (t.closest('#btnWzNext')) { salvarCamposWizard(); S.wizard.etapa = Math.min(5, S.wizard.etapa + 1); render(); return }
    if (t.closest('#btnWzAddItem')) {
      var dItem = $('wzNovoItemDesc') ? $('wzNovoItemDesc').value.trim() : ''
      if (!dItem) { toast('Informe a descrição do item.'); return }
      S.wizard.itens.push({
        codigo: 'INS-5' + (10 + S.wizard.itens.length),
        descricao: dItem,
        quantidade: Number($('wzNovoItemQtd').value) || 100,
        unidade: 'UN',
        especificacao: 'Padrão Plurix',
        precoReferenciaUnit: Number($('wzNovoItemPreco').value) || 40
      })
      render()
      return
    }
    if (t.closest('#btnWzSubmit')) {
      salvarCamposWizard()
      var w = S.wizard
      var nova = await api('/api/cotacoes/criar', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          titulo: w.titulo || 'Embalagens e filme stretch 1T27',
          descricao: w.descricao || 'Reposição trimestral para lojas',
          categoria: w.categoria,
          subcategoria: w.subcategoria,
          investida: w.investida,
          comprador: w.comprador,
          prazo: w.prazo,
          condicoesSolicitadas: {
            pagamentoPadrao: w.pagamentoPadrao,
            tipoFretePreferencial: w.tipoFretePreferencial,
            localEntrega: w.localEntrega,
            impostosRegra: w.impostosRegra,
            validadeMinimaDias: w.validadeMinimaDias,
            observacoesGerais: w.observacoesGerais
          },
          itens: w.itens,
          fornecedorIds: w.fornecedorIds
        })
      })
      await carregar(true)
      toast('Cotação ' + nova.id + ' enviada aos fornecedores.')
      S.cotacaoId = nova.id
      S.subTela = 'cotacao'
      render()
    }
  })
  function salvarCamposWizard() {
    var w = S.wizard
    if ($('wzTit')) w.titulo = $('wzTit').value
    if ($('wzCat')) w.categoria = $('wzCat').value
    if ($('wzInv')) w.investida = $('wzInv').value
    if ($('wzComp')) w.comprador = $('wzComp').value
    if ($('wzPrazo')) w.prazo = $('wzPrazo').value
    if ($('wzLocal')) w.localEntrega = $('wzLocal').value
    if ($('wzDesc')) w.descricao = $('wzDesc').value
    if ($('wzPag')) w.pagamentoPadrao = $('wzPag').value
    if ($('wzFrete')) w.tipoFretePreferencial = $('wzFrete').value
    if ($('wzImp')) w.impostosRegra = $('wzImp').value
    if ($('wzVal')) w.validadeMinimaDias = Number($('wzVal').value) || 30
  }
  document.addEventListener('change', function (e) {
    var t = e.target
    if (!t) return
    if (t.id === 'selInvestidaGlobal') { S.investida = t.value; carregar(true) }
    else if (t.id === 'fBaseCat') { S.fBase.categoria = t.value; render() }
    else if (t.id === 'fBaseUf') { S.fBase.uf = t.value; render() }
    else if (t.id === 'fBaseSit') { S.fBase.situacao = t.value; render() }
    else if (t.id === 'fBaseBloq') { S.fBase.bloqueio = t.value; render() }
    else if (t.id === 'fBaseInvEleg') { S.fBase.investidaElegivel = t.value; render() }
    else if (t.id === 'fHomInv') { S.fHom.investida = t.value; render() }
    else if (t.id === 'fHomCat') { S.fHom.categoria = t.value; render() }
    else if (t.id === 'fHomResp') { S.fHom.responsavel = t.value; render() }
    else if (t.id === 'fCotCat') { S.fCot.categoria = t.value; render() }
    else if (t.id === 'fCotSt') { S.fCot.status = t.value; render() }
    else if (t.id === 'selCotMapa') { S.cotacaoId = t.value; render() }
    else if (t.dataset && t.dataset.wzForn) {
      var id = t.dataset.wzForn
      var idx = S.wizard.fornecedorIds.indexOf(id)
      if (t.checked && idx < 0) S.wizard.fornecedorIds.push(id)
      if (!t.checked && idx >= 0) S.wizard.fornecedorIds.splice(idx, 1)
    }
  })
  document.addEventListener('input', function (e) {
    var t = e.target
    if (!t) return
    if (t.id === 'inpBuscaGlobal') {
      S.buscaGlobal = t.value
      if (S.tela === 'inicio' && t.value.trim().length >= 2) { S.tela = 'base'; S.subTela = null }
      render()
    } else if (t.id === 'fBaseBusca') {
      S.fBase.busca = t.value
      render()
      var el = $('fBaseBusca'); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length) }
    } else if (t.id === 'fHomBusca') {
      S.fHom.busca = t.value
      render()
      var el2 = $('fHomBusca'); if (el2) { el2.focus(); el2.setSelectionRange(el2.value.length, el2.value.length) }
    } else if (t.id === 'fCotBusca') {
      S.fCot.busca = t.value
      render()
      var el3 = $('fCotBusca'); if (el3) { el3.focus(); el3.setSelectionRange(el3.value.length, el3.value.length) }
    }
  })
  carregar(false)
})()
</script>
</body>
</html>
